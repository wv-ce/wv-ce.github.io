<!DOCTYPE html>
<html lang="zh-CN">

    <link rel="stylesheet" href="css/style.css" />
    <script>
      (function () {
        var saved = localStorage.getItem("wv-theme");
        var theme =
          saved ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <header class="site-header">
      <nav class="nav container">
        <a class="nav-logo" href="index.html">wv-ce</a>

          <a href="index.html">首页</a>
          <a href="blog/index.html">博客</a>
          <a href="about.html" class="active">关于</a>
          <button
            class="theme-toggle"
            id="theme-toggle"
            aria-label="切换主题"
            title="切换主题"
          >
            <span id="theme-icon">🌙</span>
          </button>
        </div>
      </nav>
    </header>

        <div class="skill-bar">
          <span class="label"><span>设计与写作</span><span>65%</span></span>
          <div class="bar"><div class="fill" style="width: 65%"></div></div>

    <footer class="site-footer">
