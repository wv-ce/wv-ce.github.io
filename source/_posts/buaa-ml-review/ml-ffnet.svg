<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330"
     font-family="Georgia, 'Times New Roman', 'Songti SC', serif" font-size="14" fill="#1f2329" stroke="none">
  <rect width="720" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arwF" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 z" fill="#6b7280"/>
    </marker>
  </defs>

  <g fill="#4b5563" font-size="13">
    <text x="28" y="24">输入层（D 个）</text>
    <text x="280" y="24">隐层（M 个，激活函数 h）</text>
    <text x="546" y="24">输出层（K 个，激活函数 σ）</text>
  </g>

  <g stroke="#9ca3af" stroke-width="1.1" fill="none">
    <line x1="82" y1="80"  x2="304" y2="80"  marker-end="url(#arwF)"/>
    <line x1="82" y1="80"  x2="304" y2="160" marker-end="url(#arwF)"/>
    <line x1="82" y1="80"  x2="304" y2="240" marker-end="url(#arwF)"/>
    <line x1="82" y1="160" x2="304" y2="80"  marker-end="url(#arwF)"/>
    <line x1="82" y1="160" x2="304" y2="160" marker-end="url(#arwF)"/>
    <line x1="82" y1="160" x2="304" y2="240" marker-end="url(#arwF)"/>
    <line x1="82" y1="256" x2="304" y2="80"  marker-end="url(#arwF)"/>
    <line x1="82" y1="256" x2="304" y2="160" marker-end="url(#arwF)"/>
    <line x1="82" y1="256" x2="304" y2="240" marker-end="url(#arwF)"/>
    <line x1="356" y1="80"  x2="574" y2="80"  marker-end="url(#arwF)"/>
    <line x1="356" y1="80"  x2="574" y2="160" marker-end="url(#arwF)"/>
    <line x1="356" y1="80"  x2="574" y2="240" marker-end="url(#arwF)"/>
    <line x1="356" y1="160" x2="574" y2="80"  marker-end="url(#arwF)"/>
    <line x1="356" y1="160" x2="574" y2="160" marker-end="url(#arwF)"/>
    <line x1="356" y1="160" x2="574" y2="240" marker-end="url(#arwF)"/>
    <line x1="356" y1="240" x2="574" y2="80"  marker-end="url(#arwF)"/>
    <line x1="356" y1="240" x2="574" y2="160" marker-end="url(#arwF)"/>
    <line x1="356" y1="240" x2="574" y2="240" marker-end="url(#arwF)"/>
  </g>

  <g stroke="#4b5563" stroke-width="1.6" fill="#ffffff">
    <circle cx="60"  cy="80"  r="22"/>
    <circle cx="60"  cy="160" r="22"/>
    <circle cx="60"  cy="256" r="22"/>
    <circle cx="330" cy="80"  r="26"/>
    <circle cx="330" cy="160" r="26"/>
    <circle cx="330" cy="240" r="26"/>
    <circle cx="600" cy="80"  r="26"/>
    <circle cx="600" cy="160" r="26"/>
    <circle cx="600" cy="240" r="26"/>
  </g>

  <g font-size="15" font-style="italic">
    <text x="50" y="86">x<tspan font-size="11" dy="4">1</tspan></text>
    <text x="50" y="166">x<tspan font-size="11" dy="4">2</tspan></text>
    <text x="48" y="262">x<tspan font-size="11" dy="4">D</tspan></text>
  </g>

  <g font-size="17">
    <text x="323" y="87">h</text>
    <text x="323" y="167">h</text>
    <text x="323" y="247">h</text>
    <text x="593" y="87">&#963;</text>
    <text x="593" y="167">&#963;</text>
    <text x="593" y="247">&#963;</text>
  </g>

  <g font-size="12" fill="#4b5563">
    <text x="288" y="196">a<tspan font-size="10" dy="3">m</tspan><tspan dy="-3">, z</tspan><tspan font-size="10" dy="3">m</tspan><tspan dy="-3"> = h(a</tspan><tspan font-size="10" dy="3">m</tspan><tspan dy="-3">)</tspan></text>
    <text x="634" y="84">y<tspan font-size="10" dy="3">n1</tspan></text>
    <text x="634" y="164">y<tspan font-size="10" dy="3">nk</tspan></text>
    <text x="634" y="244">y<tspan font-size="10" dy="3">nK</tspan></text>
  </g>

  <g font-size="13">
    <text x="176" y="118">w<tspan font-size="10" dy="-4">(1)</tspan><tspan dy="4">md</tspan></text>
    <text x="446" y="118">w<tspan font-size="10" dy="-4">(2)</tspan><tspan dy="4">km</tspan></text>
  </g>

  <text x="28" y="308" font-size="13" fill="#4b5563">a<tspan font-size="10" dy="3">m</tspan><tspan dy="-3"> = &#8721; x</tspan><tspan font-size="10" dy="3">d</tspan><tspan dy="-3"> w</tspan><tspan font-size="10" dy="-4">(1)</tspan><tspan dy="4">md</tspan><tspan dy="-3">,   a</tspan><tspan font-size="10" dy="3">k</tspan><tspan dy="-3"> = &#8721; z</tspan><tspan font-size="10" dy="3">m</tspan><tspan dy="-3"> w</tspan><tspan font-size="10" dy="-4">(2)</tspan><tspan dy="4">md</tspan><tspan dy="-3">,   y</tspan><tspan font-size="10" dy="3">nk</tspan><tspan dy="-3"> = &#963;(a</tspan><tspan font-size="10" dy="3">k</tspan><tspan dy="-3">)</tspan></text>
</svg>
