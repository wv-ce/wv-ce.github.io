<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文章 · wv-ce</title>
    <meta name="description" content="wv-ce 的博客文章。" />
    <link rel="stylesheet" href="../css/style.css" />
    <script>
      window.SITE_BASE = "../";
    </script>
    <script>
      (function () {
        var saved = localStorage.getItem("wv-theme");
        var theme =
          saved ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <header class="site-header">
      <nav class="nav container">
        <a class="nav-logo" href="../index.html">wv-ce</a>
        <div class="nav-links">
          <a href="../index.html">首页</a>
          <a href="index.html">博客</a>
          <a href="../about.html">关于</a>
          <button
            class="theme-toggle"
            id="theme-toggle"
            aria-label="切换主题"
            title="切换主题"
          >
            <span id="theme-icon">🌙</span>
          </button>
        </div>
      </nav>
    </header>

    <main class="page container">
      <article class="content">
        <div class="article-header">
          <h1 id="post-title">加载中…</h1>
          <p class="post-meta" id="post-meta"></p>
          <div class="tags" id="post-tags"></div>
        </div>
        <div id="post-body"><p>加载中…</p></div>
      </article>
    </main>

    <footer class="site-footer">
      <div class="container">© <span id="year"></span> wv-ce · 用 ❤️ 构建</div>
    </footer>

    <script src="../js/main.js"></script>
    <script src="../js/markdown.js"></script>
    <script src="../js/blog.js"></script>
  </body>
</html>
