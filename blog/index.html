<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>博客 · wv-ce</title>
    <meta name="description" content="wv-ce 的博客文章列表。" />
    <link rel="stylesheet" href="../css/style.css" />
    <script>
      (function () {
        var saved = localStorage.getItem("wv-theme");
        var theme =
          saved ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <header class="site-header">
      <nav class="nav container">
        <a class="nav-logo" href="../index.html">wv-ce</a>
        <div class="nav-links">
          <a href="../index.html">首页</a>
          <a href="index.html" class="active">博客</a>
          <a href="../about.html">关于</a>
          <button
            class="theme-toggle"
            id="theme-toggle"
            aria-label="切换主题"
            title="切换主题"
          >
            <span id="theme-icon">🌙</span>
          </button>
        </div>
      </nav>
    </header>

    <main class="page container">
      <h1>博客</h1>
      <p style="color: var(--text-muted); margin-bottom: 24px">
        记录我的技术笔记、项目经历与日常思考。
      </p>

      <ul class="post-list">
        <li>
          <a href="welcome.html">欢迎来到我的个人网站</a>
          <div class="tags">
            <span class="tag">随笔</span>
          </div>
          <p class="post-meta">2024-01-01 · 5 分钟阅读</p>
        </li>
      </ul>
    </main>

    <footer class="site-footer">
      <div class="container">© <span id="year"></span> wv-ce · 用 ❤️ 构建</div>
    </footer>

    <script src="../js/main.js"></script>
  </body>
</html>
